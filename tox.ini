[tox]
isolated_build = True
envlist =
    py{311,312,313,314}-django{52}
    py{312,313,314}-django{60}
    flake8
    coverage

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
setenv =
    PYTHONDONTWRITEBYTECODE=1
    DJANGO_SETTINGS_MODULE=tests.settings
basepython =
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14
    .package: python3
deps =
    django52: Django>=5.2.8,<5.3
    django60: Django>=6.0,<6.1
    pytest>=5.4.0
    pytest-django>=4.11.1,<5.0
allowlist_externals = poetry
commands =
    pytest tests/

[testenv:flake8]
basepython =
    python3.12
commands =
    poetry install -v
    poetry run flake8 src

[testenv:coverage]
basepython =
    python3.12
commands =
    poetry install -v
    poetry run pytest --cov=django_scim --cov-report=xml --cov-report=term
